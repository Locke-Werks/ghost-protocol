# Failed sign-ins at the Ghost Protocol login page.
#
# Matches the JSON access log Caddy writes for this vhost. Only POSTs to
# /oauth/authorize that answered 401 count, which is precisely "somebody typed
# the wrong password". The token endpoint deliberately answers 400 and never
# 401 for a bad grant, so a connector retrying an expired token cannot
# accumulate toward a ban and lock the real user out.

[Definition]
failregex = ^\{"level":"[^"]*","ts":[^,]+,"logger":"http\.log\.access[^"]*",.*"remote_ip":"<HOST>".*"method":"POST".*"uri":"/oauth/authorize".*"status":401
ignoreregex =
datepattern = {^LN-BEG}
journalmatch =
