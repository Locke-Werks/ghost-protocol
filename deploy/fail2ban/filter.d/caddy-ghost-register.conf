# Dynamic client registration being hammered.
#
# Registration is open by design: that is how claude.ai and ChatGPT add the
# connector without anyone hand-registering anything. Open does not mean
# unlimited, and the application's own per-address limit answers 429 well
# before the client table fills. This jail catches whoever keeps going anyway.

[Definition]
failregex = ^\{"level":"[^"]*","ts":[^,]+,"logger":"http\.log\.access[^"]*",.*"remote_ip":"<HOST>".*"uri":"/oauth/register".*"status":(400|429)
ignoreregex =
datepattern = {^LN-BEG}
journalmatch =
