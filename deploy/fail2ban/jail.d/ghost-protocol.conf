# Append to /etc/fail2ban/jail.local, or drop in as
# /etc/fail2ban/jail.d/ghost-protocol.conf. Matches the shape of the existing
# caddy-reliquary-* and caddy-gptimage-* jails on this box.

[caddy-ghost-401]
enabled  = true
filter   = caddy-ghost-401
logpath  = /var/log/caddy/ghost-protocol.log
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h

[caddy-ghost-register]
enabled  = true
filter   = caddy-ghost-register
logpath  = /var/log/caddy/ghost-protocol.log
port     = http,https
maxretry = 10
findtime = 10m
bantime  = 6h
